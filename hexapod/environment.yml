# Conda environment for the robot and for development machines.
# Create or update it with scripts/setup_env.sh, which also pins exact versions in a lock file.
name: hexapod
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - pyserial
  - pip
  - setuptools  # installs this project in editable mode
